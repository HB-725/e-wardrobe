<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>D · 试衣间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;display=swap">
<style>
body{margin:0}
a{color:#F4F2EE}a:hover{color:#D4BF8F}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0E0E10; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #F4F2EE">
  <header style="padding: 24px 20px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 11px; letter-spacing: 0.3em; color: #D4BF8F">FITTING ROOM</span>
      <h1 style="margin: 0; font-size: 26px; font-weight: 300; letter-spacing: 0.08em">试衣间</h1>
    </div>
    <span style="font-size: 11px; letter-spacing: 0.14em; color: #9C9A96">{{wornCount}} PIECES ON</span>
  </header>
  <div style="position: relative; margin-top: 12px; height: 408px; background: #141416; display: flex; align-items: center; justify-content: center; overflow: hidden; border-top: 1px solid #2C2C30; border-bottom: 1px solid #2C2C30">
    <div style="position: absolute; left: 50%; bottom: 30px; width: 200px; height: 26px; margin-left: -100px; border-radius: 50%; background: #1F1F23"></div>
    <div style="position: relative; width: 156px; margin-top: -10px; transform: {{fig}}; transition: transform 0.5s ease">
      <dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" skin="#CFC8BF" hint-size="156px,343px"></dc-import>
    </div>
    <div style="position: absolute; left: 20px; top: 20px; display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{credits}}" as="cr" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 1px">
          <span style="font-size: 9px; letter-spacing: 0.2em; color: #9C9A96">{{cr.slot}}</span>
          <span style="font-size: 12px; font-weight: 300">{{cr.name}}</span>
        </div>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 8px">
      <button type="button" aria-label="向左转" onClick="{{turnLeft}}" style="width: 44px; height: 44px; border: 0; background: none; color: #F4F2EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <div style="display: flex; gap: 5px; align-items: flex-end">
        <sc-for list="{{ticks}}" as="t" hint-placeholder-count="8">
          <span style="width: 2px; height: {{t.h}}px; background: {{t.bg}}"></span>
        </sc-for>
      </div>
      <span style="width: 34px; font-size: 11px; letter-spacing: 0.1em; color: #D4BF8F; text-align: center">{{angleLabel}}</span>
      <button type="button" aria-label="向右转" onClick="{{turnRight}}" style="width: 44px; height: 44px; border: 0; background: none; color: #F4F2EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
  <div style="display: flex; gap: 8px; padding: 14px 20px 0; overflow-x: auto">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <button type="button" onClick="{{c.pick}}" style="flex: none; height: 44px; padding: 0 16px; border: 1px solid {{c.border}}; border-radius: 999px; background: transparent; color: {{c.color}}; font: inherit; font-size: 13px; letter-spacing: 0.08em; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 20px 14px; overflow-x: auto">
    <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" style="flex: none; width: 74px; height: 92px; padding: 0; border: 1px solid {{t.ring}}; background: #1C1C1F; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span style="width: 56px"><dc-import name="Garment" kind="{{t.kind}}" color="{{t.color}}" hint-size="56px,67px"></dc-import></span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 20px">
    <button type="button" style="flex: 1; height: 46px; border: 1px solid #D4BF8F; border-radius: 999px; background: transparent; color: #D4BF8F; font: inherit; font-size: 13px; letter-spacing: 0.12em; cursor: pointer">保存造型</button>
    <button type="button" style="flex: 1; height: 46px; border: 0; border-radius: 999px; background: #D4BF8F; color: #0E0E10; font: inherit; font-size: 13px; font-weight: 500; letter-spacing: 0.12em; cursor: pointer">生成大片</button>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #0E0E10; border-top: 1px solid #2C2C30; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="D-Wardrobe.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #9C9A96; font-size: 10px; letter-spacing: 0.1em">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="D-Fitting.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #D4BF8F; font-size: 10px; letter-spacing: 0.1em">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      试衣间
    </a>
    <button type="button" aria-label="录入新衣服" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #D4BF8F; background: transparent; color: #D4BF8F; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button type="button" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: #9C9A96; font: inherit; font-size: 10px; letter-spacing: 0.1em; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </button>
    <button type="button" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; background: none; padding: 0; color: #9C9A96; font: inherit; font-size: 10px; letter-spacing: 0.1em; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466' },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0' },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279' },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A' },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0' },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8' },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A' },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96' },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697' },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C' },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE' },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426' },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0' }
    ];
    const CATS = [
      { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' }, { id: 'bottom', label: '下装' },
      { id: 'shoes', label: '鞋履' }, { id: 'bag', label: '配饰' }
    ];
    const SLOT = { outer: 'OUTER', top: 'TOP', bottom: 'BOTTOM', shoes: 'SHOES', bag: 'BAG' };
    const LABELS = ['正面', '右前', '右侧', '右后', '背面', '左后', '左侧', '左前'];
    const st = this.state || {};
    const worn = st.worn || { outer: 'g1', top: 'g5', bottom: 'g8', shoes: 'g11', bag: null };
    const cat = st.cat || 'outer';
    const angle = st.angle || 0;
    const byId = (id) => ITEMS.find((i) => i.id === id);
    const av = {};
    const credits = [];
    ['outer', 'top', 'bottom', 'shoes', 'bag'].forEach((k) => {
      const it = worn[k] && byId(worn[k]);
      av[k] = it ? it.kind : 'none';
      av[k + 'Color'] = it ? it.color : '#000000';
      if (it) credits.push({ slot: SLOT[k], name: it.name });
    });
    const tray = ITEMS.filter((i) => i.cat === cat).map((i) => ({
      ...i,
      ring: worn[cat] === i.id ? '#D4BF8F' : '#1C1C1F',
      pick: () => this.setState({ worn: { ...worn, [cat]: worn[cat] === i.id ? null : i.id } })
    }));
    const cats = CATS.map((c) => ({
      ...c,
      color: c.id === cat ? '#D4BF8F' : '#9C9A96',
      border: c.id === cat ? '#D4BF8F' : '#2C2C30',
      pick: () => this.setState({ cat: c.id })
    }));
    const cos = Math.cos((angle * Math.PI) / 180);
    const sx = Math.max(0.36, Math.abs(cos)) * (cos < -0.01 ? -1 : 1);
    const idx = (((angle / 45) % 8) + 8) % 8;
    const ticks = LABELS.map((l, i) => ({ h: i === idx ? 14 : 8, bg: i === idx ? '#D4BF8F' : '#4A4A50' }));
    return {
      av, tray, cats, credits, ticks,
      fig: 'scaleX(' + sx.toFixed(3) + ')',
      angleLabel: LABELS[idx],
      wornCount: Object.values(worn).filter(Boolean).length,
      turnLeft: () => this.setState({ angle: angle - 45 }),
      turnRight: () => this.setState({ angle: angle + 45 })
    };
  }
}
</script>
</body>
</html>
