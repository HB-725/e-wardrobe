<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 镜子照片校准</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <header style="height: 56px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E4E4E6">
    <a href="A-Today.dc.html" aria-label="返回今天" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 15px; font-weight: 500">记录今天的穿搭</span>
      <span style="font-size: 11px; color: #6B6B6B">10 月 29 日 · 周四</span>
    </div>
    <span style="width: 44px"></span>
  </header>
  <div style="position: absolute; top: 56px; left: 0; right: 0; bottom: 76px; overflow-y: auto">
    <div style="position: relative; margin: 16px 20px 0; height: 380px; overflow: hidden; background: #D9D4CC; display: flex; justify-content: center">
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70px; background: #BFB6A9"></div>
      <div style="position: absolute; left: 18px; top: 18px; bottom: 18px; width: 4px; background: rgba(255,255,255,0.5)"></div>
      <div style="position: relative; width: 160px; height: 352px; margin-top: 16px">
        <dc-import name="Avatar" outer="jacket" outer-color="#2E4466" top="tee" top-color="#F5F4F0" bottom="jeans" bottom-color="#4C6C96" shoes="sneakers" shoes-color="#F3F2EE" bag="none" hint-size="160px,352px"></dc-import>
        <sc-if value="{{showBoxes}}" hint-placeholder-val="{{ true }}">
          <div style="position: absolute; left: 16%; top: 17%; width: 68%; height: 35%; border: 2px solid #FFFFFF; box-sizing: border-box">
            <span style="position: absolute; left: -2px; top: -22px; padding: 2px 6px; background: #FFFFFF; font-size: 11px; white-space: nowrap">牛仔夹克</span>
          </div>
          <div style="position: absolute; left: 31%; top: 47%; width: 38%; height: 45%; border: 2px solid #FFFFFF; box-sizing: border-box">
            <span style="position: absolute; right: -2px; top: 40%; transform: translateX(100%); padding: 2px 6px; background: #FFFFFF; font-size: 11px; white-space: nowrap">直筒牛仔裤</span>
          </div>
          <div style="position: absolute; left: 28%; top: 89%; width: 44%; height: 8%; border: 2px solid #FFFFFF; box-sizing: border-box">
            <span style="position: absolute; left: -2px; bottom: -22px; padding: 2px 6px; background: #FFFFFF; font-size: 11px; white-space: nowrap">白色运动鞋</span>
          </div>
        </sc-if>
      </div>
      <button type="button" onClick="{{toggleBoxes}}" style="position: absolute; right: 10px; top: 10px; min-height: 32px; padding: 0 10px; border: 0; background: rgba(17,17,17,0.72); color: #FFFFFF; font: inherit; font-size: 12px; cursor: pointer">{{boxLabel}}</button>
    </div>
    <section style="padding: 18px 20px 0">
      <h2 style="margin: 0 0 4px; font-size: 15px; font-weight: 700">识别到 {{count}} 件衣橱里的单品</h2>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="4">
        <button type="button" onClick="{{it.toggle}}" aria-pressed="{{it.pressed}}" style="width: 100%; min-height: 64px; padding: 8px 0; border: 0; border-bottom: 1px solid #F0F0F1; background: none; font: inherit; color: #111111; display: flex; align-items: center; gap: 12px; text-align: left; cursor: pointer">
          <span style="flex: none; width: 46px; height: 46px; background: #F1F1F2; display: flex; align-items: center; justify-content: center"><span style="width: 34px"><dc-import name="Garment" kind="{{it.kind}}" color="{{it.color}}" hint-size="34px,41px"></dc-import></span></span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 500">{{it.name}}</span>
            <span style="font-size: 12px; color: #6B6B6B">{{it.note}}</span>
          </span>
          <span style="flex: none; width: 22px; height: 22px; box-sizing: border-box; border: 1.5px solid #111111; background: {{it.box}}; color: #FFFFFF; font-size: 13px; display: flex; align-items: center; justify-content: center">{{it.mark}}</span>
        </button>
      </sc-for>
      <button type="button" style="min-height: 44px; padding: 0; border: 0; background: none; font: inherit; font-size: 13px; color: #6B6B6B; text-decoration: underline; cursor: pointer">有件衣服没认出来？手动选择</button>
    </section>
    <section style="margin: 8px 20px 24px; padding: 14px 16px; background: #F1F1F2; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em">将同时更新上身效果</span>
      <p style="margin: 0; font-size: 13px; line-height: 1.6">牛仔夹克：实际更宽松，衣长到胯部（比现在的效果图长约 3 cm）。<br>直筒牛仔裤：裤脚堆在鞋面上。</p>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex">
    <a href="A-Today.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">记录今天 · 穿着次数 +1</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const off = st.off || {};
    const showBoxes = !st.hideBoxes;
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', kind: 'jacket', color: '#2E4466', note: '匹配度高 · 将校准上身效果' },
      { id: 'g5', name: '圆领T恤', kind: 'tee', color: '#F5F4F0', note: '被外套遮住一部分 · 匹配度中' },
      { id: 'g8', name: '直筒牛仔裤', kind: 'jeans', color: '#4C6C96', note: '匹配度高 · 将校准上身效果' },
      { id: 'g11', name: '白色运动鞋', kind: 'sneakers', color: '#F3F2EE', note: '匹配度高' }
    ];
    const items = ITEMS.map((i) => {
      const on = !off[i.id];
      return {
        ...i,
        pressed: on ? 'true' : 'false',
        box: on ? '#111111' : '#FFFFFF',
        mark: on ? '✓' : '',
        toggle: () => this.setState({ off: { ...off, [i.id]: on } })
      };
    });
    return {
      items, showBoxes,
      count: items.filter((i) => i.pressed === 'true').length,
      boxLabel: showBoxes ? '隐藏识别框' : '显示识别框',
      toggleBoxes: () => this.setState({ hideBoxes: showBoxes })
    };
  }
}
</script>
</body>
</html>
