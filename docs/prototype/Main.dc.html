<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 衣橱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto">
    <header style="padding: 28px 20px 12px; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; letter-spacing: 0.16em; color: #6B6B6B">MY WARDROBE</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.02em">衣橱</h1>
      </div>
      <span style="font-size: 13px; color: #6B6B6B">共 {{total}} 件</span>
    </header>
    <div style="padding: 4px 20px 0">
      <label style="display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; background: #F1F1F2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6B6B6B" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
        <input type="search" aria-label="搜索衣橱" placeholder="搜索单品、颜色、品牌" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 14px; color: #111111; outline: none">
      </label>
    </div>
    <div style="display: flex; gap: 22px; padding: 12px 20px 0; overflow-x: auto; border-bottom: 1px solid #E4E4E6">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.pick}}" style="flex: none; min-height: 44px; padding: 10px 0; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid {{c.line}}; font: inherit; font-size: 14px; font-weight: {{c.weight}}; color: {{c.color}}; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 16px 20px 4px; gap: 8px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">46</span>
        <span style="font-size: 11px; color: #6B6B6B">本月穿着次数</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">¥18</span>
        <span style="font-size: 11px; color: #6B6B6B">平均每次成本</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 20px; font-weight: 700">2</span>
        <span style="font-size: 11px; color: #6B6B6B">闲置超 6 个月</span>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px; padding: 16px 20px 28px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="position: relative; aspect-ratio: 4 / 5; background: #F1F1F2; display: flex; align-items: center; justify-content: center">
          <div style="width: 70%; opacity: 0.35"><dc-import name="Garment" kind="knit" color="#8C8C8C" hint-size="100%,150px"></dc-import></div>
          <span style="position: absolute; left: 10px; bottom: 10px; padding: 4px 8px; background: #111111; color: #FFFFFF; font-size: 11px">AI 生成中 · 约 20 秒</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 14px; font-weight: 500">新录入的单品</span>
          <span style="font-size: 12px; color: #6B6B6B">正在生成统一商品图</span>
        </div>
      </div>
      <sc-for list="{{items}}" as="it" hint-placeholder-count="6">
        <a href="A-Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: #111111">
          <div style="aspect-ratio: 4 / 5; background: #F1F1F2; display: flex; align-items: center; justify-content: center">
            <div style="width: 78%"><dc-import name="Garment" kind="{{it.kind}}" color="{{it.color}}" hint-size="100%,160px"></dc-import></div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px">
            <span style="font-size: 14px; font-weight: 500">{{it.name}}</span>
            <span style="font-size: 12px; color: #6B6B6B">{{it.catLabel}} · 穿过 {{it.wears}} 次</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="Main.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111111; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="A-Fitting.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      试衣间
    </a>
    <a href="A-Capture.dc.html" aria-label="录入新衣服" style="width: 52px; height: 44px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="A-Outfits.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </a>
    <a href="A-Me.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466', wears: 14 },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0', wears: 6 },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279', wears: 22 },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A', wears: 9 },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0', wears: 31 },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8', wears: 12 },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A', wears: 8 },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96', wears: 27 },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697', wears: 11 },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C', wears: 4 },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE', wears: 40 },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426', wears: 7 },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0', wears: 15 }
    ];
    const CL = { outer: '外套', top: '上衣', bottom: '下装', shoes: '鞋', bag: '包' };
    const CATS = [
      { id: 'all', label: '全部' }, { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' },
      { id: 'bottom', label: '下装' }, { id: 'shoes', label: '鞋' }, { id: 'bag', label: '包' }
    ];
    const cat = (this.state && this.state.cat) || 'all';
    const cats = CATS.map((c) => ({
      ...c,
      color: c.id === cat ? '#111111' : '#6B6B6B',
      weight: c.id === cat ? 700 : 400,
      line: c.id === cat ? '#111111' : 'transparent',
      pick: () => this.setState({ cat: c.id })
    }));
    const items = ITEMS.filter((i) => cat === 'all' || i.cat === cat).map((i) => ({ ...i, catLabel: CL[i.cat] }));
    return { cats, items, total: ITEMS.length + 1 };
  }
}
</script>
</body>
</html>
