<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>试衣间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <header style="padding: 28px 20px 0; display: flex; align-items: flex-end; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 11px; letter-spacing: 0.16em; color: #6B6B6B">FITTING ROOM</span>
      <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.02em">试衣间</h1>
    </div>
    <span style="font-size: 13px; color: #6B6B6B">已穿 {{wornCount}} 件</span>
  </header>
  <div style="position: absolute; left: 20px; top: 104px; width: 194px; height: 480px; background: #F1F1F2; display: flex; flex-direction: column; align-items: center">
    <div style="width: 160px; margin-top: 26px; transform: {{fig}}; transition: transform 0.4s ease">
      <dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" hint-size="160px,352px"></dc-import>
    </div>
    <div style="display: flex; gap: 5px; margin-top: 18px">
      <sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
        <span style="width: 5px; height: 5px; background: {{d.bg}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; margin-top: 8px">
      <button type="button" aria-label="向左转" onClick="{{turnLeft}}" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="width: 40px; text-align: center; font-size: 12px; color: #6B6B6B">{{angleLabel}}</span>
      <button type="button" aria-label="向右转" onClick="{{turnRight}}" style="width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
  <div style="position: absolute; left: 20px; top: 596px; width: 194px; display: flex; flex-direction: column; gap: 8px">
    <a href="A-Today.dc.html" style="height: 44px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center">今天穿这套</a>
    <div style="display: flex; gap: 8px">
      <button type="button" onClick="{{openSave}}" style="flex: 1; height: 44px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font: inherit; font-size: 13px; cursor: pointer">保存穿搭</button>
      <a href="A-Photo.dc.html" style="flex: 1; height: 44px; box-sizing: border-box; border: 1px solid #111111; color: #111111; font-size: 13px; text-decoration: none; display: flex; align-items: center; justify-content: center">生成大片</a>
    </div>
  </div>
  <div style="position: absolute; left: 222px; right: 20px; top: 104px; bottom: 152px; box-sizing: border-box; border: 1px solid #111111; display: flex">
    <div style="flex: none; width: 44px; border-right: 1px solid #E4E4E6; display: flex; flex-direction: column">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{c.pick}}" style="height: 56px; padding: 0; border: 0; border-bottom: 1px solid #E4E4E6; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 12px; font-weight: {{c.weight}}; writing-mode: vertical-rl; letter-spacing: 0.2em; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="flex: 1; min-width: 0; padding: 6px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" style="position: relative; flex: none; height: 104px; padding: 0; border: 0; background: #F1F1F2; outline: 2px solid {{t.ring}}; outline-offset: -2px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font: inherit; cursor: pointer">
          <span style="width: 58px"><dc-import name="Garment" kind="{{t.kind}}" color="{{t.color}}" hint-size="58px,70px"></dc-import></span>
          <span style="font-size: 11px; color: #111111">{{t.name}}</span>
          <sc-if value="{{t.on}}" hint-placeholder-val="{{ false }}">
            <span style="position: absolute; left: 0; top: 0; padding: 1px 6px; background: #111111; color: #FFFFFF; font-size: 10px">穿着</span>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="A-Today.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15"></rect><path d="M4 10h16M9 3v4M15 3v4"></path><rect x="10.5" y="13" width="3" height="3" fill="currentColor" stroke="none"></rect></svg>
      今天
    </a>
    <a href="C5-Wardrobe.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="C5-Fitting.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111111; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      试衣间
    </a>
    <a href="A-Outfits.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </a>
    <a href="A-Me.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </a>
  </nav>

  <sc-if value="{{saveOpen}}" hint-placeholder-val="{{ false }}">
    <button type="button" aria-label="关闭" onClick="{{closeSave}}" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(17,17,17,0.45); cursor: pointer"></button>
    <section aria-label="保存穿搭" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 28px; background: #FFFFFF; display: flex; flex-direction: column; gap: 18px">
      <span style="align-self: center; width: 40px; height: 4px; background: #D4D4D7"></span>
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">保存这套穿搭</h2>
      <div style="display: flex; gap: 14px; align-items: center">
        <span style="flex: none; width: 72px; height: 100px; background: #F1F1F2; display: flex; align-items: center; justify-content: center">
          <span style="width: 40px"><dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" hint-size="40px,88px"></dc-import></span>
        </span>
        <span style="flex: 1; font-size: 13px; line-height: 1.6; color: #6B6B6B">{{piecesText}}</span>
      </div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #6B6B6B">
        名称
        <input type="text" value="{{saveName}}" style="height: 46px; box-sizing: border-box; padding: 0 12px; border: 1px solid #C9C9CC; font: inherit; font-size: 15px; color: #111111">
      </label>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 12px; color: #6B6B6B">适合的场合（可多选）</span>
        <div style="display: flex; flex-wrap: wrap; gap: 8px">
          <sc-for list="{{occasions}}" as="o" hint-placeholder-count="6">
            <button type="button" onClick="{{o.toggle}}" aria-pressed="{{o.pressed}}" style="height: 40px; padding: 0 16px; border: 1px solid {{o.border}}; background: {{o.bg}}; color: {{o.fg}}; font: inherit; font-size: 13px; cursor: pointer">{{o.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; gap: 10px">
        <button type="button" onClick="{{closeSave}}" style="flex: 1; height: 48px; border: 1px solid #111111; background: #FFFFFF; color: #111111; font: inherit; font-size: 14px; cursor: pointer">取消</button>
        <a href="A-Outfits.dc.html" style="flex: 2; height: 48px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center">保存</a>
      </div>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466' },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0' },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279' },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A' },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0' },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8' },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A' },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96' },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697' },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C' },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE' },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426' },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0' }
    ];
    const CATS = [
      { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' }, { id: 'bottom', label: '下装' },
      { id: 'shoes', label: '鞋' }, { id: 'bag', label: '包' }
    ];
    const OCC = [
      { id: 'work', label: '通勤' }, { id: 'weekend', label: '周末' }, { id: 'date', label: '约会' },
      { id: 'travel', label: '旅行' }, { id: 'sport', label: '运动' }, { id: 'formal', label: '正式' }
    ];
    const LABELS = ['正面', '右前', '右侧', '右后', '背面', '左后', '左侧', '左前'];
    const st = this.state || {};
    const worn = st.worn || { outer: 'g1', top: 'g5', bottom: 'g8', shoes: 'g11', bag: null };
    const cat = st.cat || 'outer';
    const angle = st.angle || 0;
    const occ = st.occ || { weekend: true };
    const byId = (id) => ITEMS.find((i) => i.id === id);
    const av = {};
    const names = [];
    ['outer', 'top', 'bottom', 'shoes', 'bag'].forEach((k) => {
      const it = worn[k] && byId(worn[k]);
      av[k] = it ? it.kind : 'none';
      av[k + 'Color'] = it ? it.color : '#000000';
      if (it) names.push(it.name);
    });
    const tray = ITEMS.filter((i) => i.cat === cat).map((i) => {
      const on = worn[cat] === i.id;
      return {
        ...i, on,
        ring: on ? '#111111' : 'transparent',
        pick: () => this.setState({ worn: { ...worn, [cat]: on ? null : i.id } })
      };
    });
    const cats = CATS.map((c) => ({
      ...c,
      bg: c.id === cat ? '#111111' : '#FFFFFF',
      fg: c.id === cat ? '#FFFFFF' : '#6B6B6B',
      weight: c.id === cat ? 700 : 400,
      pick: () => this.setState({ cat: c.id })
    }));
    const occasions = OCC.map((o) => {
      const on = !!occ[o.id];
      return {
        ...o,
        pressed: on ? 'true' : 'false',
        bg: on ? '#111111' : '#FFFFFF',
        fg: on ? '#FFFFFF' : '#111111',
        border: on ? '#111111' : '#C9C9CC',
        toggle: () => this.setState({ occ: { ...occ, [o.id]: !on } })
      };
    });
    const cos = Math.cos((angle * Math.PI) / 180);
    const sx = Math.max(0.36, Math.abs(cos)) * (cos < -0.01 ? -1 : 1);
    const idx = (((angle / 45) % 8) + 8) % 8;
    const dots = LABELS.map((l, i) => ({ bg: i === idx ? '#111111' : '#C9C9CC' }));
    return {
      av, tray, cats, dots, occasions,
      fig: 'scaleX(' + sx.toFixed(3) + ')',
      angleLabel: LABELS[idx],
      wornCount: names.length,
      piecesText: names.length + ' 件 · ' + names.join('、'),
      saveName: names.slice(0, 2).join(' + '),
      saveOpen: !!st.saveOpen,
      openSave: () => this.setState({ saveOpen: true }),
      closeSave: () => this.setState({ saveOpen: false }),
      turnLeft: () => this.setState({ angle: angle - 45 }),
      turnRight: () => this.setState({ angle: angle + 45 })
    };
  }
}
</script>
</body>
</html>
