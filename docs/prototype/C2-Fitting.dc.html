<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C2 · 试衣间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&amp;family=Noto+Sans+SC:wght@500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#C6FF3D}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #160B2E; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #FFFFFF">
  <div style="position: relative; height: 500px; background: #0B0518; overflow: hidden; display: flex; justify-content: center">
    <div style="position: absolute; left: 50%; top: 0; width: 320px; height: 470px; margin-left: -160px; background: rgba(198,255,61,0.07); clip-path: polygon(42% 0, 58% 0, 100% 100%, 0 100%)"></div>
    <div style="position: absolute; left: 50%; bottom: 44px; width: 220px; height: 44px; margin-left: -110px; border-radius: 50%; border: 2px solid #C6FF3D; box-sizing: border-box"></div>
    <div style="position: absolute; left: 50%; bottom: 36px; width: 260px; height: 60px; margin-left: -130px; border-radius: 50%; border: 1.5px solid #FF4FD8; box-sizing: border-box; opacity: 0.7"></div>
    <div style="position: relative; width: 170px; margin-top: 74px; transform: {{fig}}; transition: transform 0.4s ease">
      <dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" skin="#D9D2E8" hint-size="170px,374px"></dc-import>
    </div>
    <div style="position: absolute; left: 20px; top: 22px; display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; font-weight: 900; letter-spacing: 0.2em; color: #FF4FD8">ON STAGE</span>
      <h1 style="margin: 0; font-family: 'ZCOOL QingKe HuangYou', 'Noto Sans SC', sans-serif; font-size: 34px; font-weight: 400; color: #C6FF3D; line-height: 1.1">舞台</h1>
    </div>
    <span style="position: absolute; right: 20px; top: 28px; padding: 4px 10px; border: 1.5px solid #4FE3FF; border-radius: 999px; color: #4FE3FF; font-size: 12px; font-weight: 900">{{angleLabel}}</span>
    <div style="position: absolute; right: 14px; top: 110px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{c.pick}}" style="width: 52px; height: 44px; border-radius: 14px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="position: absolute; left: 0; right: 0; bottom: 10px; display: flex; justify-content: center; align-items: center; gap: 12px">
      <button type="button" aria-label="向左转" onClick="{{turnLeft}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #4A3A7A; background: #24164A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="font-size: 12px; font-weight: 700; color: #B9AEDB">转身</span>
      <button type="button" aria-label="向右转" onClick="{{turnRight}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid #4A3A7A; background: #24164A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 14px 20px 8px">
    <h2 style="margin: 0; font-size: 16px; font-weight: 900">{{catName}}</h2>
    <span style="font-size: 12px; color: #B9AEDB">点一下换上，再点一下脱下</span>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 20px 14px; overflow-x: auto">
    <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" style="flex: none; width: 88px; height: 96px; padding: 0; border-radius: 18px; border: 2px solid {{t.ring}}; background: #24164A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <span style="width: 64px"><dc-import name="Garment" kind="{{t.kind}}" color="{{t.color}}" hint-size="64px,77px"></dc-import></span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 20px">
    <button type="button" style="flex: 1; height: 48px; border-radius: 999px; border: 2px solid #C6FF3D; background: transparent; color: #C6FF3D; font: inherit; font-size: 14px; font-weight: 900; cursor: pointer">存档这套</button>
    <button type="button" style="flex: 1; height: 48px; border-radius: 999px; border: 0; background: #FF4FD8; color: #160B2E; font: inherit; font-size: 14px; font-weight: 900; cursor: pointer">AI 拍大片</button>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 16px; right: 16px; bottom: 18px; height: 64px; box-sizing: border-box; padding: 0 6px; background: #24164A; border: 1.5px solid #4A3A7A; border-radius: 999px; display: flex; justify-content: space-around; align-items: center">
    <a href="C2-Wardrobe.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #B9AEDB; font-size: 11px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="C2-Fitting.dc.html" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #C6FF3D; font-size: 11px; font-weight: 900">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      舞台
    </a>
    <button type="button" aria-label="录入新衣服" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #C6FF3D; color: #160B2E; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button type="button" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; padding: 0; color: #B9AEDB; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </button>
    <button type="button" style="min-width: 56px; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 0; background: none; padding: 0; color: #B9AEDB; font: inherit; font-size: 11px; font-weight: 700; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466' },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0' },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279' },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A' },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0' },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8' },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A' },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96' },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697' },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C' },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE' },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426' },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0' }
    ];
    const CATS = [
      { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' }, { id: 'bottom', label: '下装' },
      { id: 'shoes', label: '鞋' }, { id: 'bag', label: '包' }
    ];
    const LABELS = ['正面', '右前', '右侧', '右后', '背面', '左后', '左侧', '左前'];
    const st = this.state || {};
    const worn = st.worn || { outer: 'g1', top: 'g5', bottom: 'g8', shoes: 'g11', bag: null };
    const cat = st.cat || 'outer';
    const angle = st.angle || 0;
    const byId = (id) => ITEMS.find((i) => i.id === id);
    const av = {};
    ['outer', 'top', 'bottom', 'shoes', 'bag'].forEach((k) => {
      const it = worn[k] && byId(worn[k]);
      av[k] = it ? it.kind : 'none';
      av[k + 'Color'] = it ? it.color : '#000000';
    });
    const tray = ITEMS.filter((i) => i.cat === cat).map((i) => ({
      ...i,
      ring: worn[cat] === i.id ? '#C6FF3D' : '#24164A',
      pick: () => this.setState({ worn: { ...worn, [cat]: worn[cat] === i.id ? null : i.id } })
    }));
    const cats = CATS.map((c) => ({
      ...c,
      bg: c.id === cat ? '#C6FF3D' : 'rgba(36,22,74,0.85)',
      fg: c.id === cat ? '#160B2E' : '#FFFFFF',
      border: c.id === cat ? '#C6FF3D' : '#4A3A7A',
      pick: () => this.setState({ cat: c.id })
    }));
    const cos = Math.cos((angle * Math.PI) / 180);
    const sx = Math.max(0.36, Math.abs(cos)) * (cos < -0.01 ? -1 : 1);
    const idx = (((angle / 45) % 8) + 8) % 8;
    return {
      av, tray, cats,
      catName: CATS.find((c) => c.id === cat).label,
      fig: 'scaleX(' + sx.toFixed(3) + ')',
      angleLabel: LABELS[idx],
      turnLeft: () => this.setState({ angle: angle - 45 }),
      turnRight: () => this.setState({ angle: angle + 45 })
    };
  }
}
</script>
</body>
</html>
