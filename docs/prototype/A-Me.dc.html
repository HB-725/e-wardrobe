<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = !(this.state && this.state.autoOff);
    return {
      autoOn: on ? 'true' : 'false',
      autoBg: on ? '#111111' : '#C9C9CC',
      autoJustify: on ? 'flex-end' : 'flex-start',
      toggleAuto: () => this.setState({ autoOff: on })
    };
  }
}
