<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C4 · 衣橱</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Caveat:wght@600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3B2F2A}a:hover{color:#E4572E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #EFE3CC; background-image: radial-gradient(#D8C7A6 1.2px, transparent 1.3px); background-size: 18px 18px; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #3B2F2A">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 86px; overflow-y: auto">
    <header style="position: relative; padding: 26px 20px 0">
      <span style="position: absolute; right: 20px; top: 24px; padding: 6px 10px; border: 2px solid #E4572E; color: #E4572E; font-family: 'Caveat', cursive; font-size: 18px; transform: rotate(8deg)">Oct. 2026</span>
      <h1 style="margin: 0; font-family: 'Ma Shan Zheng', 'Noto Sans SC', serif; font-size: 44px; font-weight: 400; line-height: 1.1">我的衣橱手账</h1>
      <p style="margin: 6px 0 0; font-size: 13px; color: #6E5E52">一共贴了 {{total}} 件 · 这个月穿了 46 次</p>
    </header>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 16px 20px 0">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
        <button type="button" onClick="{{c.pick}}" style="height: 40px; min-width: 52px; padding: 0 12px; border: 0; border-radius: 999px; background: {{c.bg}}; color: {{c.fg}}; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; transform: rotate({{c.rot}}deg); box-shadow: 0 2px 0 rgba(59,47,42,0.25)">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 14px; padding: 22px 20px 32px; align-items: flex-start">
      <sc-for list="{{cols}}" as="col" hint-placeholder-count="2">
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 22px">
          <sc-for list="{{col.items}}" as="it" hint-placeholder-count="3">
            <a href="C-Detail.dc.html" style="position: relative; display: block; padding: 8px 8px 0; background: #FFFFFF; box-shadow: 0 3px 8px rgba(59,47,42,0.18); transform: rotate({{it.rot}}deg); text-decoration: none; color: #3B2F2A">
              <span style="position: absolute; left: 50%; top: -10px; width: 64px; height: 20px; margin-left: -32px; background: {{it.tape}}; opacity: 0.8; transform: rotate({{it.tapeRot}}deg)"></span>
              <div style="aspect-ratio: {{it.ratio}}; background: #F3EEE4; display: flex; align-items: center; justify-content: center">
                <div style="width: 78%"><dc-import name="Garment" kind="{{it.kind}}" color="{{it.color}}" hint-size="100%,120px"></dc-import></div>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px 10px">
                <span style="font-size: 13px; font-weight: 700">{{it.name}}</span>
                <span style="font-family: 'Caveat', cursive; font-size: 18px; color: #E4572E">×{{it.wears}}</span>
              </div>
            </a>
          </sc-for>
        </div>
      </sc-for>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 10px 14px 0; background: #3B2F2A; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="C4-Wardrobe.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #F3B23A; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6M9 13h6M9 17h3"></path></svg>
      手账
    </a>
    <a href="C4-Fitting.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #EFE3CC; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      OOTD
    </a>
    <button type="button" aria-label="录入新衣服" style="width: 50px; height: 50px; border-radius: 50%; border: 3px dashed #EFE3CC; background: #E4572E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: rotate(-6deg)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button type="button" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; color: #EFE3CC; font: inherit; font-size: 12px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      日历
    </button>
    <button type="button" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; color: #EFE3CC; font: inherit; font-size: 12px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466', wears: 14 },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0', wears: 31 },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96', wears: 27 },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE', wears: 40 },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A', wears: 9 },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A', wears: 8 },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0', wears: 15 },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C', wears: 4 },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279', wears: 22 },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8', wears: 12 },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426', wears: 7 },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697', wears: 11 },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0', wears: 6 }
    ];
    const RATIO = { outer: '4 / 5', top: '1 / 1', bottom: '3 / 4', shoes: '5 / 4', bag: '1 / 1' };
    const TAPES = ['#F3B23A', '#2A9D8F', '#E4572E', '#B7A3D9'];
    const ROTS = [-2.5, 1.8, -1.2, 2.6, -2, 1.2];
    const CATS = [
      { id: 'all', label: '全部', c: '#3B2F2A' }, { id: 'outer', label: '外套', c: '#E4572E' }, { id: 'top', label: '上衣', c: '#2A9D8F' },
      { id: 'bottom', label: '下装', c: '#F3B23A' }, { id: 'shoes', label: '鞋', c: '#B7A3D9' }, { id: 'bag', label: '包', c: '#8C6A4F' }
    ];
    const cat = (this.state && this.state.cat) || 'all';
    const cats = CATS.map((c, i) => ({
      ...c,
      bg: c.id === cat ? c.c : '#FFFFFF',
      fg: c.id === cat ? '#FFFFFF' : '#3B2F2A',
      rot: (i % 2 ? 2 : -2),
      pick: () => this.setState({ cat: c.id })
    }));
    const list = ITEMS.filter((i) => cat === 'all' || i.cat === cat).map((i, n) => ({
      ...i,
      ratio: RATIO[i.cat],
      rot: ROTS[n % ROTS.length],
      tape: TAPES[n % TAPES.length],
      tapeRot: n % 2 ? 4 : -5
    }));
    const cols = [{ items: list.filter((_, n) => n % 2 === 0) }, { items: list.filter((_, n) => n % 2 === 1) }];
    return { cats, cols, total: ITEMS.length };
  }
}
</script>
</body>
</html>
