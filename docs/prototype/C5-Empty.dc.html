<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>首次使用</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <div style="position: absolute; top: 0; left: 0; right: 0; bottom: 84px; overflow-y: auto">
    <header style="padding: 28px 20px 0; display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; letter-spacing: 0.16em; color: #6B6B6B">MY WARDROBE</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: 0.02em">衣橱</h1>
      </div>
      <span style="font-size: 13px; color: #6B6B6B">共 0 件</span>
    </header>
    <ol style="list-style: none; margin: 18px 20px 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <li style="display: flex; flex-direction: column; gap: 6px">
        <span style="height: 3px; background: #111111"></span>
        <span style="font-size: 12px; font-weight: 700">1 · 录入衣服</span>
      </li>
      <li style="display: flex; flex-direction: column; gap: 6px">
        <span style="height: 3px; background: #E4E4E6"></span>
        <a href="A-AvatarSetup.dc.html" style="font-size: 12px; color: #6B6B6B; text-decoration: none">2 · 建立形象</a>
      </li>
      <li style="display: flex; flex-direction: column; gap: 6px">
        <span style="height: 3px; background: #E4E4E6"></span>
        <span style="font-size: 12px; color: #6B6B6B">3 · 开始换装</span>
      </li>
    </ol>
    <div style="margin: 22px 20px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-rows: 80px; gap: 6px">
      <sc-for list="{{ghosts}}" as="g" hint-placeholder-count="8">
        <span style="border: 1px dashed #C9C9CC; display: flex; align-items: center; justify-content: center">
          <span style="width: 48px; opacity: 0.22"><dc-import name="Garment" kind="{{g.kind}}" color="#8C8C90" hint-size="48px,58px"></dc-import></span>
        </span>
      </sc-for>
    </div>
    <section style="padding: 26px 20px 0; display: flex; flex-direction: column; gap: 8px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700">先把衣柜搬进来</h2>
      <p style="margin: 0; font-size: 14px; line-height: 1.7; color: #6B6B6B">第一次建议从相册批量导入，一次可以选几十张。以后买了新衣服，再点衣橱右上角的「添加」就行。</p>
    </section>
    <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
      <a href="A-Capture.dc.html" style="min-height: 64px; padding: 0 16px; background: #111111; color: #FFFFFF; text-decoration: none; display: flex; align-items: center; gap: 14px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="14" height="14"></rect><path d="M7 3h14v14"></path><path d="M3 15l4-4 4 4 2-2 4 4"></path></svg>
        <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 700">从相册批量导入</span>
          <span style="font-size: 12px; color: #C9C9CC">推荐 · 一次选几十张，后台慢慢处理</span>
        </span>
      </a>
      <a href="A-Capture.dc.html" style="min-height: 56px; padding: 0 16px; border: 1px solid #111111; color: #111111; text-decoration: none; display: flex; align-items: center; gap: 14px">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 500">一件一件拍</span>
      </a>
    </div>
    <div style="margin: 18px 20px 28px; padding: 14px 16px; background: #F1F1F2; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 1.6">
      <span>AI 会把每件衣服变成统一风格的商品图，大约 20 秒一件，你可以边录边做别的。</span>
      <span style="color: #6B6B6B">已经有 Excel 衣物清单？<a href="A-Me.dc.html">从 Excel 导入</a></span>
    </div>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="C5-Empty.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111111; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="C5-Fitting.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      试衣间
    </a>
    <a href="A-Today.dc.html" style="width: 60px; height: 52px; margin-top: -4px; background: #111111; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; font-size: 11px; font-weight: 700">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15"></rect><path d="M4 10h16M9 3v4M15 3v4"></path><rect x="10.5" y="13" width="3" height="3" fill="currentColor"></rect></svg>
      今天
    </a>
    <a href="A-Outfits.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </a>
    <a href="A-Me.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const KINDS = ['jacket', 'tee', 'jeans', 'sneakers', 'coat', 'knit', 'skirt', 'tote'];
    return { ghosts: KINDS.map((kind) => ({ kind })) };
  }
}
</script>
</body>
</html>
