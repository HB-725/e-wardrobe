<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 录入：确认</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <header style="height: 56px; box-sizing: border-box; padding: 0 8px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #E4E4E6">
    <a href="A-Capture.dc.html" aria-label="返回拍照" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #111111">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 15px; font-weight: 500">确认新单品</span>
      <span style="font-size: 11px; color: #6B6B6B">第 1 件 / 共 2 件</span>
    </div>
    <span style="width: 44px"></span>
  </header>
  <div style="position: absolute; top: 56px; left: 0; right: 0; bottom: 76px; overflow-y: auto">
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 16px 20px 0">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="height: 210px; overflow: hidden; background: repeating-linear-gradient(115deg, #CFC5B8 0px, #CFC5B8 20px, #C6BBAD 20px, #C6BBAD 23px); display: flex; align-items: center; justify-content: center">
          <div style="width: 140px; transform: rotate(-9deg) translate(-6px, 8px)"><dc-import name="Garment" kind="jacket" color="#34496B" hint-size="140px,168px"></dc-import></div>
        </div>
        <span style="font-size: 12px; color: #6B6B6B">原图</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 6px">
        <div style="height: 210px; background: #F1F1F2; display: flex; align-items: center; justify-content: center">
          <div style="width: 140px"><dc-import name="Garment" kind="jacket" color="{{chosenColor}}" hint-size="140px,168px"></dc-import></div>
        </div>
        <span style="font-size: 12px; color: #111111; font-weight: 500">标准图 · 方案 {{chosenNo}}</span>
      </div>
    </div>
    <div style="display: flex; gap: 8px; padding: 10px 20px 0; align-items: center">
      <span style="font-size: 12px; color: #6B6B6B; margin-right: 4px">候选</span>
      <sc-for list="{{cands}}" as="c" hint-placeholder-count="3">
        <button type="button" onClick="{{c.pick}}" aria-label="方案 {{c.no}}" style="width: 52px; height: 58px; padding: 0; border: 0; background: #F1F1F2; outline: 2px solid {{c.ring}}; outline-offset: -2px; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <span style="width: 38px"><dc-import name="Garment" kind="jacket" color="{{c.color}}" hint-size="38px,46px"></dc-import></span>
        </button>
      </sc-for>
      <button type="button" style="margin-left: auto; min-height: 44px; padding: 0 12px; border: 1px solid #111111; background: #FFFFFF; font: inherit; font-size: 13px; color: #111111; cursor: pointer">重新生成</button>
    </div>
    <section style="margin: 16px 20px 0; padding: 14px 16px; background: #F1F1F2; display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em">保真检查</span>
      <sc-for list="{{checks}}" as="k" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px">
          <span style="flex: none; width: 18px; height: 18px; background: {{k.bg}}; color: #FFFFFF; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{k.mark}}</span>
          <span style="flex: 1">{{k.label}}</span>
          <span style="font-size: 12px; color: #6B6B6B">{{k.note}}</span>
        </div>
      </sc-for>
    </section>
    <section style="padding: 12px 20px 24px; display: flex; flex-direction: column">
      <sc-for list="{{fields}}" as="f" hint-placeholder-count="8">
        <label style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid #F0F0F1">
          <span style="flex: none; width: 64px; font-size: 13px; color: #6B6B6B">{{f.label}}</span>
          <input type="text" value="{{f.value}}" placeholder="{{f.ph}}" style="flex: 1; min-width: 0; height: 40px; border: 0; background: transparent; font: inherit; font-size: 14px; color: #111111; outline: none">
          <sc-if value="{{f.hasSrc}}" hint-placeholder-val="{{ true }}">
            <span style="flex: none; padding: 1px 6px; border: 1px solid #111111; font-size: 10px">{{f.src}}</span>
          </sc-if>
        </label>
      </sc-for>
    </section>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; box-sizing: border-box; padding: 12px 20px 20px; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex; gap: 10px">
    <a href="C5-Wardrobe.dc.html" style="flex: 1; display: flex; align-items: center; justify-content: center; border: 1px solid #111111; color: #111111; font-size: 14px; text-decoration: none">只存原图</a>
    <a href="C5-Wardrobe.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none">保存，下一件</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pick = (this.state && this.state.pick) || 0;
    const COLORS = ['#2E4466', '#33496C', '#283C5C'];
    const cands = COLORS.map((color, i) => ({
      color, no: i + 1,
      ring: i === pick ? '#111111' : 'transparent',
      pick: () => this.setState({ pick: i })
    }));
    const checks = [
      { label: '主色一致', note: '色差 2.1', ok: true },
      { label: '纽扣 4 颗、胸袋 2 个', note: '与原图相同', ok: true },
      { label: '版型与衣长', note: '一致', ok: true },
      { label: '领口缝线', note: '略有简化', ok: false }
    ].map((k) => ({ ...k, mark: k.ok ? '✓' : '!', bg: k.ok ? '#2E7D4F' : '#B26A00' }));
    const SRC = { ai: 'AI', tag: '吊牌' };
    const fields = [
      { label: '名称', value: '牛仔夹克', src: 'ai' },
      { label: '类别', value: '外套 · 夹克', src: 'ai' },
      { label: '颜色', value: '靛蓝', src: 'ai' },
      { label: '季节', value: '春 · 秋', src: 'ai' },
      { label: '尺码', value: 'M', src: 'tag' },
      { label: '材质', value: '棉 100%', src: 'tag' },
      { label: '品牌', value: '', ph: '选填' },
      { label: '价格', value: '', ph: '选填' },
      { label: '存放位置', value: '', ph: '选填，例如卧室衣柜左二层' }
    ].map((f) => ({ ...f, ph: f.ph || '', hasSrc: !!f.src, src: SRC[f.src] || '' }));
    return { cands, checks, fields, chosenColor: COLORS[pick], chosenNo: pick + 1 };
  }
}
</script>
</body>
</html>
