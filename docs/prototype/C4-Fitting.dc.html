<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>C4 · 试衣间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&amp;family=Caveat:wght@600&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#3B2F2A}a:hover{color:#E4572E}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background-color: #EFE3CC; background-image: radial-gradient(#D8C7A6 1.2px, transparent 1.3px); background-size: 18px 18px; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #3B2F2A">
  <header style="position: relative; padding: 22px 20px 0; display: flex; align-items: baseline; justify-content: space-between">
    <h1 style="margin: 0; font-family: 'Ma Shan Zheng', 'Noto Sans SC', serif; font-size: 38px; font-weight: 400">今日 OOTD</h1>
    <span style="font-family: 'Caveat', cursive; font-size: 20px; color: #E4572E; transform: rotate(-4deg)">10.29 Wed.</span>
  </header>
  <div style="position: absolute; left: 22px; top: 86px; width: 214px; padding: 10px 10px 0; background: #FFFFFF; box-shadow: 0 4px 10px rgba(59,47,42,0.2); transform: rotate(-2deg)">
    <span style="position: absolute; left: 60px; top: -12px; width: 90px; height: 24px; background: #2A9D8F; opacity: 0.75; transform: rotate(-4deg)"></span>
    <div style="height: 290px; background: #F3EEE4; display: flex; align-items: center; justify-content: center; overflow: hidden">
      <div style="width: 124px; transform: {{fig}}; transition: transform 0.4s ease"><dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" hint-size="124px,273px"></dc-import></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 0 6px">
      <button type="button" aria-label="向左转" onClick="{{turnLeft}}" style="width: 44px; height: 44px; border: 0; background: none; color: #3B2F2A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span style="font-family: 'Ma Shan Zheng', serif; font-size: 20px">{{angleLabel}}</span>
      <button type="button" aria-label="向右转" onClick="{{turnRight}}" style="width: 44px; height: 44px; border: 0; background: none; color: #3B2F2A; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  </div>
  <div style="position: absolute; left: 248px; right: 14px; top: 104px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{credits}}" as="cr" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 6px; transform: rotate({{cr.rot}}deg)">
        <span style="flex: none; width: 14px; border-top: 2px dashed #3B2F2A"></span>
        <span style="padding: 4px 8px; background: {{cr.bg}}; color: #3B2F2A; font-size: 13px; font-weight: 700; box-shadow: 0 2px 0 rgba(59,47,42,0.25)">{{cr.name}}</span>
      </div>
    </sc-for>
    <span style="margin-top: 6px; font-family: 'Caveat', cursive; font-size: 20px; color: #E4572E; transform: rotate(-3deg)">feeling good!</span>
  </div>
  <section style="position: absolute; left: 14px; right: 14px; top: 460px; padding: 12px 12px 14px; background: #FFFFFF; box-shadow: 0 3px 8px rgba(59,47,42,0.15)">
    <div style="display: flex; gap: 14px; border-bottom: 2px dashed #D8C7A6">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
        <button type="button" onClick="{{c.pick}}" style="min-height: 40px; padding: 0 2px; border: 0; background: none; font-family: 'Ma Shan Zheng', 'Noto Sans SC', serif; font-size: 20px; color: {{c.color}}; cursor: pointer">{{c.label}}</button>
      </sc-for>
    </div>
    <div style="display: flex; gap: 12px; padding-top: 12px; overflow-x: auto">
      <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
        <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" style="flex: none; position: relative; width: 76px; height: 76px; padding: 0; border-radius: 50%; border: 3px solid {{t.ring}}; background: #F3EEE4; box-shadow: 0 2px 0 rgba(59,47,42,0.25); transform: rotate({{t.rot}}deg); display: flex; align-items: center; justify-content: center; cursor: pointer">
          <span style="width: 50px"><dc-import name="Garment" kind="{{t.kind}}" color="{{t.color}}" hint-size="50px,60px"></dc-import></span>
        </button>
      </sc-for>
    </div>
  </section>
  <div style="position: absolute; left: 14px; right: 14px; top: 660px; display: flex; gap: 12px">
    <button type="button" style="flex: 1; height: 48px; border: 2px dashed #E4572E; background: transparent; color: #E4572E; font-family: 'Ma Shan Zheng', 'Noto Sans SC', serif; font-size: 20px; cursor: pointer; transform: rotate(-1deg)">贴进手账</button>
    <button type="button" style="flex: 1; height: 48px; border: 0; background: #2A9D8F; color: #FFFFFF; font-family: 'Ma Shan Zheng', 'Noto Sans SC', serif; font-size: 20px; cursor: pointer; transform: rotate(1deg)">冲洗大片</button>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 86px; box-sizing: border-box; padding: 10px 14px 0; background: #3B2F2A; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="C4-Wardrobe.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #EFE3CC; font-size: 12px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6M9 13h6M9 17h3"></path></svg>
      手账
    </a>
    <a href="C4-Fitting.dc.html" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: #F3B23A; font-size: 12px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      OOTD
    </a>
    <button type="button" aria-label="录入新衣服" style="width: 50px; height: 50px; border-radius: 50%; border: 3px dashed #EFE3CC; background: #E4572E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; transform: rotate(-6deg)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
    <button type="button" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; color: #EFE3CC; font: inherit; font-size: 12px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
      日历
    </button>
    <button type="button" style="min-width: 56px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 2px; border: 0; background: none; padding: 0; color: #EFE3CC; font: inherit; font-size: 12px; cursor: pointer">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466' },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0' },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279' },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A' },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0' },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8' },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A' },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96' },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697' },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C' },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE' },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426' },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0' }
    ];
    const CATS = [
      { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' }, { id: 'bottom', label: '下装' },
      { id: 'shoes', label: '鞋' }, { id: 'bag', label: '包' }
    ];
    const TAGBG = ['#F3B23A', '#9ED9CF', '#F6B8A6', '#D3C6EC', '#E8D8B8'];
    const LABELS = ['正面', '右前', '右侧', '右后', '背面', '左后', '左侧', '左前'];
    const st = this.state || {};
    const worn = st.worn || { outer: 'g1', top: 'g5', bottom: 'g8', shoes: 'g11', bag: null };
    const cat = st.cat || 'outer';
    const angle = st.angle || 0;
    const byId = (id) => ITEMS.find((i) => i.id === id);
    const av = {};
    const credits = [];
    ['outer', 'top', 'bottom', 'shoes', 'bag'].forEach((k, n) => {
      const it = worn[k] && byId(worn[k]);
      av[k] = it ? it.kind : 'none';
      av[k + 'Color'] = it ? it.color : '#000000';
      if (it) credits.push({ name: it.name, bg: TAGBG[n], rot: n % 2 ? 2 : -2 });
    });
    const tray = ITEMS.filter((i) => i.cat === cat).map((i, n) => {
      const on = worn[cat] === i.id;
      return {
        ...i,
        ring: on ? '#E4572E' : '#FFFFFF',
        rot: n % 2 ? 5 : -5,
        pick: () => this.setState({ worn: { ...worn, [cat]: on ? null : i.id } })
      };
    });
    const cats = CATS.map((c) => ({
      ...c,
      color: c.id === cat ? '#E4572E' : '#3B2F2A',
      pick: () => this.setState({ cat: c.id })
    }));
    const cos = Math.cos((angle * Math.PI) / 180);
    const sx = Math.max(0.36, Math.abs(cos)) * (cos < -0.01 ? -1 : 1);
    const idx = (((angle / 45) % 8) + 8) % 8;
    return {
      av, tray, cats, credits,
      fig: 'scaleX(' + sx.toFixed(3) + ')',
      angleLabel: LABELS[idx],
      turnLeft: () => this.setState({ angle: angle - 45 }),
      turnRight: () => this.setState({ angle: angle + 45 })
    };
  }
}
</script>
</body>
</html>
