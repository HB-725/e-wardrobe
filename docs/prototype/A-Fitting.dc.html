<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>A · 试衣间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#111111}a:hover{color:#444444}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #FFFFFF; font-family: 'Noto Sans SC', system-ui, sans-serif; color: #111111">
  <header style="height: 64px; box-sizing: border-box; padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 11px; letter-spacing: 0.16em; color: #6B6B6B">FITTING ROOM</span>
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">试衣间</h1>
    </div>
    <span style="font-size: 13px; color: #6B6B6B">已穿 {{wornCount}} 件</span>
  </header>
  <div style="position: relative; height: 400px; margin: 4px 20px 0; background: #F1F1F2; display: flex; align-items: center; justify-content: center; overflow: hidden">
    <div style="width: 160px; transform: {{fig}}; transition: transform 0.4s ease">
      <dc-import name="Avatar" outer="{{av.outer}}" outer-color="{{av.outerColor}}" top="{{av.top}}" top-color="{{av.topColor}}" bottom="{{av.bottom}}" bottom-color="{{av.bottomColor}}" shoes="{{av.shoes}}" shoes-color="{{av.shoesColor}}" bag="{{av.bag}}" bag-color="{{av.bagColor}}" hint-size="160px,352px"></dc-import>
    </div>
    <button type="button" aria-label="向左转" onClick="{{turnLeft}}" style="position: absolute; left: 8px; top: 178px; width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </button>
    <button type="button" aria-label="向右转" onClick="{{turnRight}}" style="position: absolute; right: 8px; top: 178px; width: 44px; height: 44px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
    </button>
    <div style="position: absolute; left: 0; right: 0; bottom: 12px; display: flex; flex-direction: column; align-items: center; gap: 6px">
      <div style="display: flex; gap: 6px">
        <sc-for list="{{dots}}" as="d" hint-placeholder-count="8">
          <span style="width: 6px; height: 6px; background: {{d.bg}}"></span>
        </sc-for>
      </div>
      <span style="font-size: 11px; color: #6B6B6B">{{angleLabel}} · 左右滑动旋转</span>
    </div>
  </div>
  <div style="display: flex; gap: 22px; padding: 6px 20px 0; border-bottom: 1px solid #E4E4E6">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
      <button type="button" onClick="{{c.pick}}" style="flex: none; min-height: 44px; padding: 10px 0; margin-bottom: -1px; background: none; border: 0; border-bottom: 2px solid {{c.line}}; font: inherit; font-size: 14px; font-weight: {{c.weight}}; color: {{c.color}}; cursor: pointer">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 12px 20px; overflow-x: auto">
    <sc-for list="{{tray}}" as="t" hint-placeholder-count="4">
      <button type="button" onClick="{{t.pick}}" aria-label="{{t.name}}" style="flex: none; width: 76px; display: flex; flex-direction: column; gap: 4px; align-items: stretch; padding: 0; border: 0; background: none; font: inherit; cursor: pointer">
        <span style="display: flex; align-items: center; justify-content: center; height: 84px; background: #F1F1F2; outline: 2px solid {{t.ring}}; outline-offset: -2px">
          <span style="width: 60px"><dc-import name="Garment" kind="{{t.kind}}" color="{{t.color}}" hint-size="60px,72px"></dc-import></span>
        </span>
        <span style="font-size: 11px; color: #111111; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{t.name}}</span>
      </button>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 0 20px">
    <a href="A-Outfits.dc.html" style="flex: 1; height: 44px; box-sizing: border-box; border: 1px solid #111111; background: #FFFFFF; color: #111111; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center">保存穿搭</a>
    <a href="A-Photo.dc.html" style="flex: 1; height: 44px; background: #111111; color: #FFFFFF; font-size: 14px; font-weight: 500; text-decoration: none; display: flex; align-items: center; justify-content: center">生成真人大片</a>
  </div>
  <nav aria-label="主导航" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding: 8px 8px 0; background: #FFFFFF; border-top: 1px solid #E4E4E6; display: flex; justify-content: space-around; align-items: flex-start">
    <a href="Main.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 6.5a2 2 0 1 1 2.6 1.9c-.4.2-.6.5-.6.9V11"></path><path d="M12 11l-8.6 6.2a1 1 0 0 0 .6 1.8h16a1 1 0 0 0 .6-1.8z"></path></svg>
      衣橱
    </a>
    <a href="A-Fitting.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #111111; font-size: 11px; font-weight: 700">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="2.2"></circle><path d="M12 7.5v7M7.5 10.5h9M12 14.5l-3 6.5M12 14.5l3 6.5"></path></svg>
      试衣间
    </a>
    <a href="A-Capture.dc.html" aria-label="录入新衣服" style="width: 52px; height: 44px; background: #111111; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </a>
    <a href="A-Outfits.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z"></path><path d="M3 13l9 5 9-5"></path></svg>
      穿搭
    </a>
    <a href="A-Me.dc.html" style="width: 64px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: #6B6B6B; font-size: 11px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      我的
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ITEMS = [
      { id: 'g1', name: '牛仔夹克', cat: 'outer', kind: 'jacket', color: '#2E4466' },
      { id: 'g2', name: '哈灵顿夹克', cat: 'outer', kind: 'harrington', color: '#D8C8A0' },
      { id: 'g3', name: '连帽羽绒服', cat: 'outer', kind: 'puffer', color: '#8B8279' },
      { id: 'g4', name: '羊毛大衣', cat: 'outer', kind: 'coat', color: '#A9845A' },
      { id: 'g5', name: '圆领T恤', cat: 'top', kind: 'tee', color: '#F5F4F0' },
      { id: 'g6', name: '牛津衬衫', cat: 'top', kind: 'shirt', color: '#C3D5E8' },
      { id: 'g7', name: '麻花针织衫', cat: 'top', kind: 'knit', color: '#41594A' },
      { id: 'g8', name: '直筒牛仔裤', cat: 'bottom', kind: 'jeans', color: '#4C6C96' },
      { id: 'g9', name: '卡其休闲裤', cat: 'bottom', kind: 'chinos', color: '#C4B697' },
      { id: 'g10', name: '百褶半裙', cat: 'bottom', kind: 'skirt', color: '#3A3A3C' },
      { id: 'g11', name: '白色运动鞋', cat: 'shoes', kind: 'sneakers', color: '#F3F2EE' },
      { id: 'g12', name: '乐福鞋', cat: 'shoes', kind: 'loafers', color: '#4A3426' },
      { id: 'g13', name: '帆布托特包', cat: 'bag', kind: 'tote', color: '#D6C9B0' }
    ];
    const CATS = [
      { id: 'outer', label: '外套' }, { id: 'top', label: '上衣' }, { id: 'bottom', label: '下装' },
      { id: 'shoes', label: '鞋' }, { id: 'bag', label: '包' }
    ];
    const LABELS = ['正面', '右前', '右侧', '右后', '背面', '左后', '左侧', '左前'];
    const st = this.state || {};
    const worn = st.worn || { outer: 'g1', top: 'g5', bottom: 'g8', shoes: 'g11', bag: null };
    const cat = st.cat || 'outer';
    const angle = st.angle || 0;
    const byId = (id) => ITEMS.find((i) => i.id === id);
    const av = {};
    ['outer', 'top', 'bottom', 'shoes', 'bag'].forEach((k) => {
      const it = worn[k] && byId(worn[k]);
      av[k] = it ? it.kind : 'none';
      av[k + 'Color'] = it ? it.color : '#000000';
    });
    const tray = ITEMS.filter((i) => i.cat === cat).map((i) => ({
      ...i,
      ring: worn[cat] === i.id ? '#111111' : 'transparent',
      pick: () => this.setState({ worn: { ...worn, [cat]: worn[cat] === i.id ? null : i.id } })
    }));
    const cats = CATS.map((c) => ({
      ...c,
      color: c.id === cat ? '#111111' : '#6B6B6B',
      weight: c.id === cat ? 700 : 400,
      line: c.id === cat ? '#111111' : 'transparent',
      pick: () => this.setState({ cat: c.id })
    }));
    const cos = Math.cos((angle * Math.PI) / 180);
    const sx = Math.max(0.36, Math.abs(cos)) * (cos < -0.01 ? -1 : 1);
    const idx = (((angle / 45) % 8) + 8) % 8;
    const dots = LABELS.map((l, i) => ({ bg: i === idx ? '#111111' : '#C9C9CC' }));
    return {
      av, tray, cats, dots,
      fig: 'scaleX(' + sx.toFixed(3) + ')',
      angleLabel: LABELS[idx],
      wornCount: Object.values(worn).filter(Boolean).length,
      turnLeft: () => this.setState({ angle: angle - 45 }),
      turnRight: () => this.setState({ angle: angle + 45 })
    };
  }
}
</script>
</body>
</html>
